<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f6f8fc">
  <title>Redirecting…</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fc;
      --bg-soft: #eef2f9;
      --card: #fff;
      --accent: #3b6ef6;
      --accent-2: #7c5cff;
      --accent-soft: #e8eeff;
      --text: #0e1530;
      --muted: #5f6b8a;
      --muted-2: #8791aa;
      --border: #e6eaf3;
      --ring: rgba(59, 110, 246, .28);
      --success: #16845b;
      --danger: #b42318;
      --shadow: 0 20px 50px rgba(16, 24, 60, .10), 0 1px 2px rgba(16, 24, 60, .05);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: calc(20px + env(safe-area-inset-top, 0px))
               calc(18px + env(safe-area-inset-right, 0px))
               calc(20px + env(safe-area-inset-bottom, 0px))
               calc(18px + env(safe-area-inset-left, 0px));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(1100px 720px at 10% -10%, rgba(124, 92, 255, .09), transparent 62%),
        radial-gradient(900px 640px at 112% 112%, rgba(59, 110, 246, .10), transparent 62%),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 45%, var(--bg-soft) 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 32px 26px 24px;
      overflow: hidden;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: card-in .35s ease-out both;
    }
    .card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      content: "";
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .logo {
      display: grid;
      width: 56px;
      height: 56px;
      margin: 2px auto 16px;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px rgba(59, 110, 246, .22), inset 0 1px 0 rgba(255, 255, 255, .4);
    }
    .logo svg { display: block; width: 26px; height: 26px; }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 680;
      letter-spacing: .1px;
      line-height: 1.3;
    }
    .sub {
      max-width: 34ch;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .progress-wrap {
      width: 100%;
      height: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      background: var(--accent-soft);
      border-radius: 99px;
    }
    .progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .18s linear;
    }
    .status {
      display: flex;
      min-height: 22px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }
    .spinner {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .btn {
      display: inline-flex;
      width: 100%;
      min-height: 54px;
      margin-top: 22px;
      padding: 14px 22px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(59, 110, 246, .26);
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .1px;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: filter .15s ease, transform .12s ease, box-shadow .15s ease;
    }
    .btn:hover { filter: brightness(1.04); box-shadow: 0 14px 32px rgba(59, 110, 246, .32); }
    .btn:active { transform: scale(.985); }
    .btn:focus-visible, .fallback-link:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
    }
    .btn[hidden] { display: none; }
    .arrow { transition: transform .15s ease; }
    .btn:hover .arrow { transform: translateX(3px); }
    .foot {
      display: flex;
      margin-top: 18px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted-2);
      font-size: 12px;
    }
    .foot svg { width: 13px; height: 13px; opacity: .8; }
    .fallback {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .fallback[hidden] { display: none; }
    .fallback-link { color: var(--accent); font-weight: 600; }
    .noscript {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 380px) {
      .card { padding: 26px 20px 20px; border-radius: 18px; }
      h1 { font-size: 18px; }
      .sub { font-size: 13.5px; }
      .logo { width: 52px; height: 52px; border-radius: 14px; }
      .btn { min-height: 52px; font-size: 15.5px; }
    }
    @media (max-height: 560px) and (orientation: landscape) {
      body { align-items: flex-start; }
      .card { margin-block: auto; padding: 22px 22px 18px; }
      .logo { width: 46px; height: 46px; margin-bottom: 12px; }
      h1 { font-size: 18px; margin-bottom: 5px; }
      .sub { margin-bottom: 14px; font-size: 13px; }
      .btn { margin-top: 15px; min-height: 48px; }
      .foot { margin-top: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
      .spinner { animation: none; border-top-color: var(--accent); }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12h13M12 5l7 7-7 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 id="page-title">Preparing your redirect</h1>
    <p class="sub" id="description">You’re about to continue to the destination website. This will only take a few seconds.</p>

    <div class="progress-wrap" id="progressWrap" role="progressbar"
         aria-label="Preparing redirect" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress" id="progress"></div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true">
      <span class="spinner" id="spinner" aria-hidden="true"></span>
      <span id="statusText">Preparing…</span>
    </div>

    <a class="btn" id="continueLink" href="https://meridian-hub.pro" rel="noopener noreferrer">
      <span>Continue to website</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <p class="fallback" id="fallback" hidden>
      If you are not redirected, <a class="fallback-link" id="fallbackLink" href="https://meridian-hub.pro">click here</a>.
    </p>

    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 10V7.5a5 5 0 0 1 10 0V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="4.5" y="10" width="15" height="10" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      External website redirect
    </div>

    <noscript>
      <p class="noscript">Automatic redirect requires JavaScript. Use the “Continue to website” link above.</p>
    </noscript>
  </main>

  <script>
    (() => {
      "use strict";

      /*
       * НАСТРОЙКИ
       * Укажите здесь адрес назначения.
       * Для защиты от open redirect разрешены только домены из ALLOWED_HOSTS.
       */
      const CONFIG = {
        targetUrl: "https://meridian-hub.pro/",
        allowedHosts: ["meridian-hub.pro"],
        autoRedirect: true,       // true — перейти автоматически; false — только по нажатию
        delayMs: 1600,             // длительность индикатора перед переходом
        showButtonAfterMs: 500,    // когда показать кнопку
        requireInteraction: false  // true — переход только после явного нажатия
      };

      const $ = (id) => document.getElementById(id);
      const progress = $("progress");
      const progressWrap = $("progressWrap");
      const status = $("status");
      const statusText = $("statusText");
      const spinner = $("spinner");
      const continueLink = $("continueLink");
      const fallback = $("fallback");
      const fallbackLink = $("fallbackLink");

      let redirectStarted = false;
      let animationFrame = 0;
      let startTime = 0;

      function validateTarget(rawUrl) {
        const url = new URL(rawUrl, window.location.href);
        const allowed = CONFIG.allowedHosts.map((host) => host.toLowerCase());

        if (url.protocol !== "https:" && url.protocol !== "http:") {
          throw new Error("Unsupported URL protocol.");
        }
        if (!allowed.includes(url.hostname.toLowerCase())) {
          throw new Error("Destination host is not allowed.");
        }
        if (url.username || url.password) {
          throw new Error("URLs containing credentials are not allowed.");
        }
        return url.href;
      }

      function setStatus(message, state) {
        statusText.textContent = message;
        status.classList.remove("success", "error");
        if (state) status.classList.add(state);
      }

      function showError(message) {
        cancelAnimationFrame(animationFrame);
        spinner.hidden = true;
        progress.style.width = "0%";
        progressWrap.setAttribute("aria-valuenow", "0");
        progressWrap.hidden = true;
        setStatus(message, "error");
        continueLink.hidden = true;
        fallback.hidden = true;
      }

      function goToTarget(event) {
        if (event) event.preventDefault();
        if (redirectStarted) return;
        redirectStarted = true;
        cancelAnimationFrame(animationFrame);
        continueLink.setAttribute("aria-disabled", "true");
        continueLink.style.pointerEvents = "none";
        setStatus("Redirecting…");
        // Навигация инициируется действием пользователя либо выбранной автонавигацией.
        window.location.assign(targetUrl);
      }

      let targetUrl;
      try {
        targetUrl = validateTarget(CONFIG.targetUrl);
        continueLink.href = targetUrl;
        fallbackLink.href = targetUrl;
      } catch (error) {
        showError("Could not validate the destination URL.");
        // Ошибка не приводит к перенаправлению на непроверенный URL.
        console.error("Redirect target validation failed:", error);
        return;
      }

      continueLink.addEventListener("click", goToTarget);

      // Без JavaScript ссылка остаётся видимой только если CSS/скрипты не скрывают её.
      // По умолчанию кнопка видна, поэтому даже при ручном режиме переход доступен.
      continueLink.hidden = false;

      const delay = Math.max(0, Number(CONFIG.delayMs) || 0);
      const showButtonDelay = Math.max(0, Number(CONFIG.showButtonAfterMs) || 0);

      window.setTimeout(() => {
        continueLink.hidden = false;
        fallback.hidden = false;
      }, showButtonDelay);

      function animateProgress(now) {
        if (!startTime) startTime = now;
        const elapsed = now - startTime;
        const percent = delay === 0 ? 100 : Math.min(100, (elapsed / delay) * 100);

        progress.style.width = percent.toFixed(1) + "%";
        progressWrap.setAttribute("aria-valuenow", String(Math.round(percent)));

        if (percent < 100) {
          animationFrame = requestAnimationFrame(animateProgress);
          return;
        }

        spinner.hidden = true;
        setStatus("Ready to continue", "success");

        if (CONFIG.autoRedirect && !CONFIG.requireInteraction) {
          window.setTimeout(() => {
            if (!redirectStarted) goToTarget();
          }, 150);
        } else {
          setStatus("Select the button below to continue");
          spinner.hidden = true;
        }
      }

      animationFrame = requestAnimationFrame(animateProgress);
    })();
  </script>
</body>
</html>
